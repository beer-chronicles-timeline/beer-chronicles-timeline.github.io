name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Preserve published URL history
        env:
          BASE_SHA: ${{ github.event.before || github.sha }}
        run: node scripts/check-event-path-history.mjs "$BASE_SHA"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check timeline payload budget
        run: npm run check:timeline-payload

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser accessibility tests
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"
        run: npm run test:e2e

      - name: Recover successful release performance history
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-performance-history.mjs

      - name: Measure mobile route performance
        id: performance
        continue-on-error: true
        env:
          PERFORMANCE_HISTORY_PATH: .cache/performance-history.json
        run: npm run measure:timeline-mobile

      - name: Retain release measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/performance
          retention-days: 90
          if-no-files-found: warn

      - name: Verify live publication
        run: npm run check:publication -- --require-live

      - name: Retain expected release identity
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.run_id }}
          path: .cache/release-manifest.json
          overwrite: true
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest-${{ github.run_id }}
          path: .cache
      - name: Check published routes and historical aliases
        run: node scripts/check-live-routes.mjs

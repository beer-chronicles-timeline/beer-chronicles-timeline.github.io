name: Source link audit

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-link-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check audit regression tests (offline)
        run: npx tsx --test tests/sourceCitations.test.ts tests/sourceLinkAudit.test.ts tests/siteLinkAudit.test.ts tests/sourceLinkReview.test.ts

      # Public HTTP only: no Supabase credentials, database queries, mutations,
      # source repairs, issue updates, commits, or deployments.
      - name: Audit published citations and site hyperlinks (read-only)
        run: npm run check:source-links

      - name: Upload source-link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-link-report-${{ github.run_id }}
          path: artifacts/source-link-report
          if-no-files-found: error
          retention-days: 90

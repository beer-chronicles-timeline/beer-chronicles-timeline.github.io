name: Source link audit

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check published source links
        run: npm run check:source-links

      - name: Notify through a GitHub issue
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const report = JSON.parse(
              fs.readFileSync(
                "artifacts/source-link-report/source-link-report.json",
                "utf8"
              )
            );
            const title = "Source link audit: unavailable citations";
            const missing = report.results.filter(
              (result) => result.status === "missing"
            );
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "all",
                per_page: 100,
              }
            );
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title
            );
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            if (missing.length === 0) {
              if (existing && existing.state === "open") {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body:
                    `The source-link audit completed without any definite ` +
                    `404 or 410 responses. [View the workflow run](${runUrl}).`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }
              return;
            }

            const rows = missing.map((result) => {
              const events = result.references
                .map((reference) => reference.eventTitle)
                .join("; ");
              const destination = result.finalUrl
                ? `${result.url} → ${result.finalUrl}`
                : result.url;
              return `- HTTP ${result.httpStatus ?? "—"}: ${destination}\n  - Referenced by: ${events}`;
            });
            const body = [
              "This issue is maintained automatically by the monthly, read-only source-link audit.",
              "",
              `The latest run found **${missing.length}** unique citation URL(s) returning HTTP 404 or 410.`,
              "",
              "Automated-client blocks, rate limits, transient server errors, and network failures are excluded. Verify every link manually before making an editorial change.",
              "",
              ...rows,
              "",
              `[View the workflow run and download the complete report](${runUrl}).`,
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body,
                state: "open",
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

            core.warning(
              `${missing.length} citation URL(s) returned HTTP 404 or 410. ` +
              `The tracking issue has been updated.`
            );

      - name: Upload source-link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-link-report-${{ github.run_id }}
          path: artifacts/source-link-report
          if-no-files-found: warn
          retention-days: 90

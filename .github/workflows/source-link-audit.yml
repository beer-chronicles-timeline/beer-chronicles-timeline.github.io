name: Source link audit

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check published source links
        run: npm run check:source-links

      - name: Upload source-link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-link-report-${{ github.run_id }}
          path: artifacts/source-link-report
          if-no-files-found: warn
          retention-days: 90

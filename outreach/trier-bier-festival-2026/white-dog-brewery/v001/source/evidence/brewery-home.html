  function checkLeeftijd() {
    var leeftijd = prompt("Ben je ouder dan 18 jaar? Voer je leeftijd in:");
    
    if (leeftijd >= 18) {
      alert("Welkom! Je bent oud genoeg.");
    } else {
      var toestemming = confirm("Sorry, je bent te jong. Deze website is alleen voor 18 jaar en ouder. Wil je doorgaan?");
      
      if (toestemming) {
        alert("Welkom! Je hebt toestemming om door te gaan.");
      } else {
        alert("Bedankt voor je begrip. Je wordt nu doorgestuurd of de toegang wordt beperkt.");

      }
    }
  }
</script>
